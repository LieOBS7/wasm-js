<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Debug 2</title>
</head>
<body style="background:#1e1e1e;color:#d4d4d4;font-family:monospace;padding:20px;">
<div id="out"></div>
<script>
function out(msg) {
  document.getElementById('out').innerHTML += msg + '<br>';
}

out('1. 开始 fetch quickjs.wasm');

fetch('./quickjs.wasm').then(function(r) {
  out('2. fetch 返回 status=' + r.status);
  if (!r.ok) { out('FAIL: 404'); return; }
  return r.arrayBuffer();
}).then(function(bytes) {
  if (!bytes) return;
  out('3. bytes length=' + bytes.byteLength);
  
  // 检查魔数
  var view = new Uint8Array(bytes, 0, 4);
  out('4. 魔数: ' + view[0] + ' ' + view[1] + ' ' + view[2] + ' ' + view[3]);
  
  // 同步 try-catch 包 compile
  try {
    out('5. 开始 WebAssembly.compile...');
    WebAssembly.compile(bytes).then(function(mod) {
      out('6. compile 成功! module=' + mod);
      out('现在加载终端...');
      // 成功后才加载 xterm
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js';
      s.onload = function() {
        out('xterm loaded, 创建终端');
        document.getElementById('out').innerHTML = '';
        var d = document.createElement('div');
        d.id = 'term';
        d.style.cssText = 'width:100vw;height:100vh;position:fixed;top:0;left:0;';
        document.body.appendChild(d);
        var term = new (window.Terminal || window.xterm.Terminal)({
          fontSize: 14, fontFamily: 'monospace',
          theme: { background:'#1e1e1e', foreground:'#d4d4d4' }, cursorBlink: true
        });
        term.open(d);
        term.focus();
        term.writeln('QuickJS WASM OK!');
        term.write('> ');
      };
      s.onerror = function() { out('FAIL: xterm 加载失败'); };
      document.head.appendChild(s);
    }).catch(function(e) {
      out('FAIL: compile Promise reject: ' + e.message);
    });
  } catch(e) {
    out('FAIL: compile 同步报错: ' + e.message);
  }
}).catch(function(e) {
  out('FAIL: fetch 报错: ' + e.message);
});
</script>
</body>
</html>
