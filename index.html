<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/></head>
<body style="background:#1e1e1e;color:#fff;font-family:monospace;padding:20px;">
<div id="log"></div>
<input id="i" type="text" placeholder="JS代码" style="width:70%;font-size:16px;padding:8px;" />
<button id="b" style="width:25%;font-size:16px;padding:8px;">执行</button>
<script type="module">
document.getElementById('log').innerHTML = '脚本开始加载<br>';

// 测试1: xterm 能不能加载
import('https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js').then(m => {
  document.getElementById('log').innerHTML += 'xterm OK<br>';
}).catch(e => {
  document.getElementById('log').innerHTML += 'xterm FAIL: ' + e.message + '<br>';
});

// 测试2: browser_wasi_shim 能不能加载
import('https://cdn.jsdelivr.net/npm/@bjorn3/browser_wasi_shim/dist/index.min.js').then(m => {
  document.getElementById('log').innerHTML += 'WASI OK, keys: ' + Object.keys(m).join(',') + '<br>';
}).catch(e => {
  document.getElementById('log').innerHTML += 'WASI FAIL: ' + e.message + '<br>';
});

// 测试3: wasm 能不能 fetch
fetch('./quickjs.wasm').then(r => {
  document.getElementById('log').innerHTML += 'wasm fetch status=' + r.status + ' size=' + r.headers.get('content-length') + '<br>';
}).catch(e => {
  document.getElementById('log').innerHTML += 'wasm fetch FAIL: ' + e.message + '<br>';
});

document.getElementById('b').addEventListener('click', () => {
  alert('按钮被点了！输入内容: ' + document.getElementById('i').value);
  document.getElementById('log').innerHTML += '按钮点击，输入=' + document.getElementById('i').value + '<br>';
});
</script>
</body>
</html>
