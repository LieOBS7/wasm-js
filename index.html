<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>QuickJS WASM Terminal</title>
<style>
  body { margin:0; background:#1e1e1e; color:#d4d4d4; font-family:Menlo,Monaco,monospace; height:100vh; display:flex; flex-direction:column; }
  #term { flex:1; padding:8px; overflow:hidden; }
  .bottom { display:flex; height:52px; background:#2d2d2d; border-top:1px solid #444; }
  #input-bar { flex:1; background:transparent; border:none; color:#d4d4d4; font-size:16px; padding:0 12px; outline:none; }
  #run-btn { width:72px; background:#007acc; color:#fff; border:none; font-size:16px; cursor:pointer; }
</style>
</head>
<body>
<div id="term"></div>
<div class="bottom">
  <input id="input-bar" type="text" placeholder="输入 JS 代码" autocomplete="off" autofocus />
  <button id="run-btn">执行</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script type="module">
import { WASI, OpenFile, File, ConsoleStdout } from 'https://cdn.jsdelivr.net/npm/@bjorn3/browser_wasi_shim/dist/index.min.js';

const term = new Terminal({
  fontSize: 14, fontFamily: 'Menlo, Monaco, monospace',
  theme: { background:'#1e1e1e', foreground:'#d4d4d4' },
  cursorBlink: true, disableStdin: true,
});
term.open(document.getElementById('term'));
const inputBar = document.getElementById('input-bar');
const runBtn = document.getElementById('run-btn');

term.writeln('\x1b[36mQuickJS WASM Terminal\x1b[0m');
term.writeln('Loading quickjs.wasm ...');

const wasmBytes = await fetch('./quickjs.wasm').then(r => {
  if (!r.ok) throw new Error('quickjs.wasm not found (' + r.status + ')');
  return r.arrayBuffer();
});
term.writeln('Loaded ' + Math.round(wasmBytes.byteLength/1024) + ' KB');
term.writeln('\x1b[32mCompiling...\x1b[0m');
const wasmModule = await WebAssembly.compile(wasmBytes);
term.writeln('\x1b[32mReady. 输入 JS 点执行.\x1b[0m');
term.write('\x1b[33m> \x1b[0m');

async function runCode() {
  const line = inputBar.value.trim();
  if (!line) { term.write('\x1b[33m> \x1b[0m'); return; }
  if (line === 'exit') { term.writeln('Bye.'); return; }

  term.write('\x1b[33m> \x1b[0m' + line + '\r\n');
  inputBar.value = '';

  try {
    let output = '';
    const decoder = new TextDecoder('utf-8');

    // ✅ 修复：不再使用 buf.filter，直接安全解码
    const fds = [
      new OpenFile(new File([])), // stdin (0)
      ConsoleStdout.lineBuffered((msg) => { 
        // msg 可能是 Uint8Array 或字符串，统一转字符串
        if (typeof msg === 'string') {
          output += msg;
        } else {
          output += decoder.decode(msg);
        }
      }), // stdout (1)
      ConsoleStdout.lineBuffered((msg) => { 
        if (typeof msg === 'string') {
          output += '\x1b[31m' + msg + '\x1b[0m';
        } else {
          output += '\x1b[31m' + decoder.decode(msg) + '\x1b[0m';
        }
      }), // stderr (2)
    ];

    const args = ['quickjs', '-e', line];
    const env = [];
    const wasi = new WASI(args, env, fds);

    const instance = await WebAssembly.instantiate(wasmModule, {
      wasi_snapshot_preview1: wasi.wasiImport,
    });
    
    wasi.start(instance);

    if (output) {
      term.write(output + '\r\n');
    } else {
      term.write('(no output)\r\n');
    }
  } catch(e) {
    term.write('\x1b[31m' + e.message + '\x1b[0m\r\n');
  }
  term.write('\x1b[33m> \x1b[0m');
}

runBtn.addEventListener('click', () => { runCode(); });
inputBar.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); runCode(); }
});
document.getElementById('term').addEventListener('click', () => inputBar.focus());
setTimeout(() => inputBar.focus(), 300);
  </script>
</body>
</html>
